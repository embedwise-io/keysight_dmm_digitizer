[project]
name = "keysight-daq"
dynamic = ["version"]   # from keysight_daq.__version__
description = "Digitizing GUI for Keysight Truevolt 34465A/34470A DMMs over LAN"
requires-python = ">=3.12"
# Minimum versions are the ones this was tested with; uv.lock pins the exact set (uv sync).
dependencies = [
    "h5py>=3.16",          # HDF5 export
    "numpy>=2.5",
    "pyqtgraph>=0.14",
    "PyQt6>=6.11",
    "pyvisa>=1.16",
    "pyvisa-py>=0.8",      # pure-Python VISA backend (no Keysight IO Libraries needed)
    "zeroconf>=0.151",     # lets pyvisa-py discover HiSLIP instruments via mDNS
    "psutil>=7.2",         # lets pyvisa-py enumerate network interfaces for VXI-11 discovery
]

[project.optional-dependencies]
usb = ["pyusb>=1.3"]

[project.scripts]
keysight-daq = "keysight_daq.gui:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["keysight_daq"]

[tool.setuptools.dynamic]
version = { attr = "keysight_daq.__version__" }
