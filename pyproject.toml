[project]
name = "keysight-daq"
version = "0.1.0"
description = "Digitizing GUI for Keysight Truevolt 34465A/34470A DMMs over LAN"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyqtgraph>=0.13",
    "PyQt6",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",   # pure-Python VISA backend (no Keysight IO Libraries needed)
    "zeroconf",         # lets pyvisa-py discover HiSLIP instruments via mDNS
    "psutil",           # lets pyvisa-py enumerate network interfaces for VXI-11 discovery
]

[project.optional-dependencies]
usb = ["pyusb"]

[project.scripts]
keysight-daq = "keysight_daq.gui:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["keysight_daq"]
